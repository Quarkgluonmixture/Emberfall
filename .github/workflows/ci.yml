name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # eslint-visitor-keys 5 requires Node ^20.19, ^22.13, or >=24.
          # Use the current LTS line rather than relying on npm's EBADENGINE warning.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      - run: npx vite build
